    <meta name="description" content="分级英语新闻阅读 · 从你的水平开始，用英语看世界" />
    <title>Level Read · 分级英语新闻</title>
    <script>
      // Set html[data-theme] before first paint (user choice > system preference).
      (function () {
        try {
          var m = localStorage.getItem('levelread-theme');
          var dark = m === 'dark' || ((m === 'auto' || m === null) && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14161a' : '#f1efe4');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
